[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdexe"
version = "0.2.33"
description = "Suite for Downloading, Editing & eXporting Everything: local tools for media, PDF, images, AV, file conversion, and text"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Gedaliah Sax"}]
keywords = ["media", "pdf", "image", "audio", "video", "conversion", "download", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia",
    "Topic :: Utilities",
]
dependencies = [
    # Floors are versions the tests pass on. yt-dlp needs Python 3.11, so sdexe
    # does too. The "<" caps are on libraries whose major releases have
    # broken sdexe or remove APIs on a schedule (pypdf 7 broke page numbers and
    # watermarks on fresh installs); raise a cap after running the tests on it.
    "flask>=3.1.3",
    # Floor pin, not an exact pin. YouTube breaks older yt-dlp releases within
    # weeks, and the failure looks like a missing video, so an upgrade of sdexe
    # must also pull a current engine.
    # [default] brings yt-dlp-ejs, the YouTube JS challenge solver, pinned to
    # match the engine.
    "yt-dlp[default]>=2026.11.23",
    "pypdf>=7.1.1,<8",
    "Pillow>=13.0,<14",
    "markdown>=3.11.4",
    "rich>=15.0",
    # The clickable terminal app `sdexe` opens.
    "textual>=8.2.8,<9",
    "pystray>=0.19.5",
    "PyYAML>=6.0.4",
    "qrcode>=8.2",
    "imageio-ffmpeg>=0.8.1",
    "certifi>=2026.11.20",
    # Cover art for FLAC and Opus downloads (yt-dlp EmbedThumbnail).
    "mutagen>=1.48.1",
    "pypdfium2>=5.15.2,<6",
    "pillow-heif>=1.9",
    "openpyxl>=3.1.5",
    "html2text>=2025.4.15",
    "sqlparse>=0.6.1",
    "py7zr>=1.1.4",
    "tomli-w>=1.2",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0.0", "pyannote.audio>=3.1,<5"]

[project.urls]
Homepage = "https://github.com/gedaliahs/sdexe"
Repository = "https://github.com/gedaliahs/sdexe.git"
Issues = "https://github.com/gedaliahs/sdexe/issues"

[project.scripts]
sdexe = "sdexe.__main__:main"

[tool.setuptools.packages.find]
include = ["sdexe*"]

[tool.setuptools.package-data]
sdexe = ["templates/**/*", "static/**/*"]
